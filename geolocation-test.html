<html>

<body>

    <h1>GEOLOCATION SCRIPT TEST:</h1>
    <h2>FROM TIMEZONE: free and related to client's device timezone.</h2>
    <p id="continentFromTimezone">Not Found / Blocked by Device</p>
    <h2>FROM IP ADDRESS: limited free version (max 50k request a month), can be wrong if client under VPN, can be blocked by device security restrictions</h2>
    <p id="ipAddress">Not Found / Blocked by Device</p>
    <script>
        var continent = Intl.DateTimeFormat().resolvedOptions().timeZone.split("/")[0];
        document.getElementById("continentFromTimezone").innerHTML = continent.toUpperCase();
        fetch('https://ipinfo.io/json')
            .then(response => response.json())
            .then(data => {
                console.log(data);
                document.getElementById("ipAddress").innerHTML = JSON.stringify(data);
            })
            .catch(error => {
                console.error('Error fetching IP:', error);
            });

    </script>

</body>
